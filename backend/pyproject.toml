[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xinyu-v2-backend"
version = "0.1.0"
description = "心语 V2 Python 业务后端"
requires-python = ">=3.14,<3.15"
dependencies = [
  "argon2-cffi==25.1.0",
  "fastapi==0.128.8",
  "pydantic==2.13.4",
  "httpx==0.28.1",
  "uvicorn==0.39.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.16.5",
  "mypy==1.19.1",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/infra/ai/prompt/templates/*.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "tests"]
